services:
  postgres:
    image: postgres:16
    container_name: serenity-postgres
    environment:
      POSTGRES_DB: serenity
      POSTGRES_USER: serenity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - serenity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serenity -d serenity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  serenity_pgdata:
